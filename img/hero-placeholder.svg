<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMax slice" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#152232"/>
      <stop offset="35%" stop-color="#1E3448"/>
      <stop offset="65%" stop-color="#2C3E50"/>
      <stop offset="100%" stop-color="#3A5049"/>
    </linearGradient>
    <linearGradient id="auroraGrad" x1="0" y1="0" x2="1" y2="0.3">
      <stop offset="0%" stop-color="#65E6C5" stop-opacity="0"/>
      <stop offset="45%" stop-color="#65E6C5" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#58735C" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#65E6C5" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="mtn1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3A4E52"/>
      <stop offset="100%" stop-color="#26343A"/>
    </linearGradient>
    <linearGradient id="mtn2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2A3B40"/>
      <stop offset="100%" stop-color="#1B2529"/>
    </linearGradient>
    <linearGradient id="mtn3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A2528"/>
      <stop offset="100%" stop-color="#101819"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#skyGrad)"/>

  <path d="M0,150 Q480,80 960,180 T1920,140 L1920,0 L0,0 Z" fill="url(#auroraGrad)" opacity="0.8"/>
  <path d="M0,260 Q480,180 960,280 T1920,230" fill="none" stroke="#65E6C5" stroke-opacity="0.18" stroke-width="40"/>

  <!-- Far mountain layer -->
  <path d="M0,560 L120,470 L260,540 L420,400 L600,520 L760,430 L940,540 L1120,460 L1300,560 L1480,420 L1650,540 L1800,470 L1920,540 L1920,1080 L0,1080 Z" fill="url(#mtn1)"/>

  <!-- Mid mountain layer -->
  <path d="M0,700 L160,600 L340,690 L520,560 L700,680 L880,580 L1060,700 L1260,600 L1440,700 L1620,590 L1800,700 L1920,640 L1920,1080 L0,1080 Z" fill="url(#mtn2)"/>

  <!-- Near mountain layer -->
  <path d="M0,860 L200,760 L380,840 L560,740 L780,850 L980,770 L1180,860 L1400,780 L1600,860 L1800,790 L1920,850 L1920,1080 L0,1080 Z" fill="url(#mtn3)"/>

  <!-- Snow caps -->
  <path d="M120,470 L100,490 L140,490 Z M420,400 L400,420 L440,420 Z M1480,420 L1460,440 L1500,440 Z" fill="#E8EEEC" opacity="0.7"/>
</svg>
